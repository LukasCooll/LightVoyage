<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<title>New Tab</title>
<style>
html{scroll-behavior:smooth}
&::-webkit-scrollbar{display:none}
body{margin:0;height:100vh;background-color:#2A7B9B;font-family:Arial,sans-serif;position:relative;overflow-x:hidden}
form{display:flex;justify-content:center;align-items:center;gap:10px}
.inputt{border:2px solid transparent;width:30em;height:2.5em;padding:0 .8em;outline:none;background-color:rgba(243,243,243,.95);border-radius:10px;transition:border-color .25s ease,box-shadow .25s ease,background-color .25s ease;box-sizing:border-box}
.inputt:hover{border-color:#4A9DEC;background-color:white}
.inputt:focus{border-color:#4A9DEC;box-shadow:0 0 0 5px rgba(74,157,236,.2);background-color:white}
button{background-color:white;color:#030303;border-radius:10em;font-size:17px;padding:.5em 1em;cursor:pointer;font-weight:400;transition:all .2s ease;border:1px solid #4A9DEC;box-shadow:0 0 0 0 rgba(74,157,236,0)}
button:hover{border-color:#4A9DEC;box-shadow:0 0 0 5px rgba(74,157,236,.2);transform:translateY(-1px)}
button:focus-visible{outline:none;border-color:#4A9DEC;box-shadow:0 0 0 5px rgba(74,157,236,.2)}
button:active{transform:translateY(1px);box-shadow:0 0 0 3px rgba(74,157,236,.15)}
.content{background:rgba(255,251,251,.92);padding:20px;border-radius:18px;width:600px;height:200px;margin:50px auto 10px;display:flex;justify-content:center;align-items:center;box-sizing:border-box}
.logo{width:500px;max-width:100%;height:auto;max-height:170px;object-fit:contain;display:block}
.bookmarks{color:white;padding:10px;border-radius:10px;width:600px;margin:30px auto 10px;display:flex;align-items:center;gap:10px;box-sizing:border-box;flex-wrap:wrap;justify-content:center}
#addBookmark{width:42px;height:42px;padding:0;display:flex;justify-content:center;align-items:center}
#bookmarkList{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bookmarkitem{width:42px;height:42px;padding:8px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.bookmarkitem:hover{background:rgba(255,255,255,.4);transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.12)}
.bookmarkimg{width:20px;height:20px;display:block}
.popup-overlay{position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:999;display:none}
.popup-overlay.open{display:block}
.bookmarkpopup{background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);width:min(500px,calc(100% - 40px));box-sizing:border-box;padding:28px;border-radius:22px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.95);opacity:0;z-index:1000;display:none;flex-direction:column;gap:8px;box-shadow:0 25px 60px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.6)}
.bookmarkpopup.open{display:flex;animation:popupOpen .2s ease forwards}
@keyframes popupOpen{from{opacity:0;transform:translate(-50%,-50%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.bookmarkpopup h1{font-size:22px;font-weight:600;margin:0 0 10px;color:#222}
.bookmarkpopup label{font-size:14px;font-weight:600;color:#444;margin-top:5px}
.bookmarkpopup input{width:100%;height:44px;box-sizing:border-box;border:1px solid #d8d8d8;border-radius:11px;padding:0 13px;font-size:15px;background:rgba(245,245,245,.9);outline:none;transition:all .2s ease}
.bookmarkpopup input:hover{border-color:#aaa;background:white}
.bookmarkpopup input:focus{border-color:#4A9DEC;background:white;box-shadow:0 0 0 4px rgba(74,157,236,.15)}
.bmclose{align-self:flex-end;width:34px;height:34px;padding:0;border:none;background:#f1f1f1;color:#555;border-radius:50%;font-size:18px;font-weight:600;transition:all .2s ease}
.bmclose:hover{background:#e7e7e7;color:#111;transform:scale(1.05);box-shadow:none}
.bmsubmit{width:100%;height:44px;margin-top:14px;border:none;border-radius:11px;background:#4A9DEC;color:white;font-size:15px;font-weight:600;box-shadow:0 5px 15px rgba(74,157,236,.25)}
.bmsubmit:hover{background:#398bd8;border:none;color:white;box-shadow:0 7px 20px rgba(74,157,236,.35);transform:translateY(-2px)}
.search-container{display:flex;justify-content:center;align-items:center;margin-top:2em}
.button-container{display:flex;justify-content:flex-end;align-items:center;width:100%;box-sizing:border-box;padding:20px 24px 0}
.settingsbtn{background:none;border:none;cursor:pointer;font-size:22px;color:white;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background-color .2s ease,transform .2s ease}
.settingsbtn:hover{background:rgba(255,255,255,.15);border:none;box-shadow:none;transform:rotate(30deg)}
.settings-sidebar{position:fixed;top:0;right:-350px;width:350px;height:100%;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:1050;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;gap:20px;transition:right .35s cubic-bezier(.16,1,.3,1)}
.settings-sidebar.open{right:0}
.sidebar-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:14px}
.sidebar-header h2{margin:0;font-size:20px;color:#222;font-weight:600}
.sidebar-close{background:#f1f1f1;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.sidebar-close:hover{background:#e7e7e7;color:#111}
.sidebar-content{display:flex;flex-direction:column;gap:16px;color:#333}
.sidebar-content p{margin:0;color:#666;font-size:14px;line-height:1.5}
.background-title{font-size:16px;font-weight:600;color:#222;margin:4px 0 0}
.background-options{display:flex;flex-direction:column;gap:8px}
.background-option{width:100%;height:44px;border:1px solid #ddd;border-radius:11px;background:#f7f7f7;color:#333;text-align:left;padding:0 14px;font-size:14px;display:flex;align-items:center;gap:10px;box-sizing:border-box;box-shadow:none}
.background-option:hover{background:#eee;border-color:#bbb;box-shadow:none;transform:none}
.background-option.active{border-color:#4A9DEC;background:#eef6ff;box-shadow:0 0 0 3px rgba(74,157,236,.12)}
.background-option i{width:18px;text-align:center}
.color-settings{display:none;flex-direction:column;gap:12px;padding-top:4px}
.color-settings.open{display:flex}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.color-row label{font-size:14px;color:#444}
.color-picker{width:55px;height:35px;border:1px solid #d5d5d5;border-radius:8px;padding:3px;background:white;cursor:pointer}
.angle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.angle-row label{font-size:14px;color:#444}
#gradientAngle{width:100%;accent-color:#4A9DEC}
.randomize-gradient{width:100%;height:40px;border-radius:10px;border:1px solid #4A9DEC;background:white;color:#333;font-size:14px;box-shadow:none}
.randomize-gradient:hover{background:#f2f8ff;box-shadow:none;transform:none}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:1040;display:none;opacity:0;transition:opacity .3s ease}
.sidebar-overlay.open{display:block;opacity:1}
@media(max-width:700px){
.content{width:calc(100% - 40px);height:180px}
.logo{width:90%;max-height:150px}
.bookmarks{width:calc(100% - 40px)}
.inputt{width:60vw}
form img{display:none}
.settings-sidebar{width:100%;right:-100%}
}
</style>
</head>
<body>
<div class="button-container">
<button class="settingsbtn" id="openSettings"><i class="fa-solid fa-gear"></i></button>
</div>

<div class="content">
<img id="logo" class="logo" src="./Logo.png" alt="Logo">
</div>

<div class="bookmarks">
<button id="addBookmark"><i class="fa-solid fa-plus"></i></button>
<div id="bookmarkList"></div>
</div>

<div class="search-container">
<form action="https://www.google.com/search" method="get" target="_blank">
<img src="https://www.google.com/s2/favicons?domain=google.com&sz=32" style="width:32px;height:32px" alt="Google Logo">
<input class="inputt" type="text" name="q" placeholder="Search Google..." required>
<button type="submit">Search</button>
</form>
</div>

<div class="popup-overlay"></div>

<div class="bookmarkpopup">
<button class="bmclose">×</button>
<h1>Add bookmark</h1>
<label for="bmname">Name</label>
<input type="text" id="bmname" placeholder="example">
<label for="bmurl">URL</label>
<input type="text" id="bmurl" placeholder="https://example.com">
<button class="bmsubmit">Add bookmark</button>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="settings-sidebar" id="settingsSidebar">
<div class="sidebar-header">
<h2>Settings</h2>
<button class="sidebar-close" id="closeSettings">×</button>
</div>

<div class="sidebar-content">
<p>Customize your new tab options, themes, and configuration modules here.</p>

<div class="background-title">Background</div>

<div class="background-options">
<button class="background-option" data-background="solid"><i class="fa-solid fa-circle"></i>Solid color</button>
<button class="background-option" data-background="gradient"><i class="fa-solid fa-palette"></i>Gradient</button>
<button class="background-option" data-background="random"><i class="fa-solid fa-wand-magic-sparkles"></i>Random gradient</button>
</div>

<div class="color-settings" id="solidSettings">
<div class="color-row">
<label for="solidColor">Color</label>
<input class="color-picker" type="color" id="solidColor" value="#2A7B9B">
</div>
</div>

<div class="color-settings" id="gradientSettings">
<div class="color-row">
<label for="gradientColor1">Color 1</label>
<input class="color-picker" type="color" id="gradientColor1" value="#2A7B9B">
</div>

<div class="color-row">
<label for="gradientColor2">Color 2</label>
<input class="color-picker" type="color" id="gradientColor2" value="#57C785">
</div>

<div class="angle-row">
<label for="gradientAngle">Angle</label>
<input type="range" id="gradientAngle" min="0" max="360" value="90">
</div>

<button class="randomize-gradient" id="randomizeGradient">Randomize gradient</button>

</div>
</div>
</div>

<script>
const openSettingsBtn=document.getElementById("openSettings")
const closeSettingsBtn=document.getElementById("closeSettings")
const settingsSidebar=document.getElementById("settingsSidebar")
const sidebarOverlay=document.getElementById("sidebarOverlay")

function openSidebar(){
settingsSidebar.classList.add("open")
sidebarOverlay.classList.add("open")
}

function closeSidebar(){
settingsSidebar.classList.remove("open")
sidebarOverlay.classList.remove("open")
}

openSettingsBtn.addEventListener("click",openSidebar)
closeSettingsBtn.addEventListener("click",closeSidebar)
sidebarOverlay.addEventListener("click",closeSidebar)
</script>

<script src="./mainpage.js"></script>

</body>
</html>
